<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ profile.display_name }} | شهدآور</title><link rel="stylesheet" href="{{ url_for('css_files',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='theme.css') }}"></head><body><main class="public-profile"><div class="profile-card"><div class="avatar">{% if profile.avatar %}<img src="{{ url_for('uploads',filename='profiles/'+profile.avatar) }}" alt="{{ profile.display_name }}">{% else %}<span>👤</span>{% endif %}</div><h1>{{ profile.display_name }}</h1><div class="username">@{{ profile.username }}</div><div class="bio">{{ profile.bio_html|safe }}</div><div class="profile-links">{% for x in profile.links %}<a href="{{ x.url }}" target="_blank" rel="noopener">{{ x.title }}</a>{% endfor %}</div><a class="brand" href="/">🍯 شهدآور</a></div></main><style>.public-profile{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:35px 18px;background:radial-gradient(circle at top,#fff7d9,#f7efe1 55%,#eee3d2)}.profile-card{width:min(520px,100%);text-align:center;background:rgba(255,255,255,.94);border:1px solid #e9ddc9;border-radius:30px;padding:30px 24px;box-shadow:0 25px 80px rgba(70,48,15,.12)}.avatar{width:120px;height:120px;margin:-75px auto 15px;border-radius:50%;background:#fff;border:6px solid #fff0c8;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:48px}.avatar img{width:100%;height:100%;object-fit:cover}.public-profile h1{margin:8px 0 2px}.username{color:#a47417;font-size:13px}.bio{line-height:2;margin:20px 0;color:#665742}.profile-links{display:grid;gap:10px}.profile-links a{padding:13px 15px;border-radius:14px;background:#fff7df;border:1px solid #ecd59d;text-decoration:none;color:#4c3715;font-weight:900}.brand{display:inline-block;margin-top:20px;color:#9b6b0e;text-decoration:none;font-weight:900}</style></body></html>
