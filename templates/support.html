<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="csrf-token" content="{{ csrf_token }}"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پشتیبانی آنلاین | {{ site.site_name }}</title>
<link rel="stylesheet" href="{{ url_for('css_files',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='theme.css') }}"><script src="{{ url_for('js_files',filename='theme.js') }}"></script>
<style>
:root{--gold:#e6b637;--gold2:#f7d76b;--ink:#17130d;--chat:#f5f0e6;--bubble:#fffdf8;--mine:#f4c94e;--line:#e7dbc3}
*{box-sizing:border-box}.support-page{min-height:100vh;padding:26px 14px 34px;background:radial-gradient(circle at 15% 0,rgba(229,180,54,.15),transparent 28%),radial-gradient(circle at 100% 100%,rgba(229,180,54,.10),transparent 25%)}
.support-card{width:min(760px,100%);height:min(900px,calc(100vh - 28px));min-height:700px;margin:auto;display:grid;grid-template-rows:auto 1fr auto;background:#fff;border:1px solid #eadfcd;border-radius:30px;overflow:hidden;box-shadow:0 25px 80px rgba(45,31,8,.14)}
.support-hero{position:relative;min-height:118px;padding:18px 22px;display:flex;align-items:center;gap:15px;color:#fff;background:#0a0c0d url('{{ url_for('images',filename='support/support-cover.svg') }}') center/cover no-repeat;isolation:isolate}
.support-hero.has-custom{background-image:linear-gradient(90deg,rgba(7,8,9,.68),rgba(7,8,9,.22)),url('{{ url_for('uploads',filename='support_branding/' + support_branding.background_image) }}')}
.support-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.48),transparent 58%);z-index:-1}.support-avatar-wrap{width:88px;height:88px;flex:0 0 88px;position:relative;display:grid;place-items:center}.support-avatar-wrap:before{content:"";position:absolute;inset:-7px;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:linear-gradient(135deg,#fff4b1,#c88d18,#ffe486);filter:drop-shadow(0 9px 18px rgba(0,0,0,.25))}.support-avatar-wrap:after{content:"";position:absolute;inset:0;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:#12100d}.support-avatar{position:relative;z-index:2;width:72px;height:72px;object-fit:cover;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);display:block}.support-title{min-width:0}.support-title h1{margin:0;font-size:23px;letter-spacing:-.4px}.support-title .verified{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:6px;border-radius:50%;background:linear-gradient(145deg,#ffe37b,#c58b18);color:#231a08;box-shadow:0 3px 9px rgba(0,0,0,.2);vertical-align:-2px}.verified-gold{display:inline-grid;place-items:center;width:20px;height:20px;margin-inline-start:6px;border-radius:50%;background:linear-gradient(145deg,#ffe98f,#c78f18);color:#3a2804;box-shadow:0 3px 9px rgba(199,143,24,.35);vertical-align:-3px}.verified-gold svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}.support-title p{margin:7px 0 0;color:#dfe7e2;font-size:12px}.support-online{display:inline-flex;align-items:center;gap:7px;color:#9ef0a8;font-weight:800;font-size:11px}.support-online i{width:7px;height:7px;border-radius:50%;background:#53dc67;box-shadow:0 0 0 4px rgba(83,220,103,.12)}
.support-pinned-bar{display:none;align-items:center;gap:8px;padding:8px 12px;background:#fff8dc;color:#74550d;border-bottom:1px solid #ead7a3;font-size:10px;font-weight:900;cursor:pointer}.support-pinned-bar.open{display:flex}.support-pinned-bar svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.support-messages{position:relative;overflow:auto;padding:22px 20px;background:var(--chat);background-image:radial-gradient(rgba(143,105,28,.05) 1px,transparent 1px);background-size:20px 20px}.support-row{display:flex;margin:7px 0}.support-row.user{justify-content:flex-start}.support-row.owner{justify-content:flex-end}.support-bubble{position:relative;max-width:min(78%,650px);padding:9px 11px 8px;font-size:12px;border:1px solid rgba(90,68,28,.10);border-radius:18px;line-height:1.72;white-space:pre-wrap;word-break:break-word;background:var(--bubble);box-shadow:0 4px 14px rgba(52,38,12,.05)}.support-row.user .support-bubble{border-bottom-right-radius:5px}.support-row.owner .support-bubble{background:var(--mine);border-bottom-left-radius:5px;color:#2a210e}.support-bubble.pinned{box-shadow:0 0 0 2px rgba(215,163,31,.35),0 7px 22px rgba(84,57,10,.12)}.pinned-mark{display:inline-flex;align-items:center;gap:5px;margin-bottom:6px;padding:3px 7px;border-radius:999px;background:rgba(218,168,45,.14);color:#8d650c;font-size:9px;font-weight:900}.support-media{display:block;max-width:150px;width:auto;height:auto;max-height:170px;object-fit:cover;margin-top:9px;border:2px solid #e5b62e;border-radius:11px;cursor:zoom-in;box-shadow:0 6px 16px rgba(74,50,8,.12)}.support-file{display:inline-flex;margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.55);color:inherit;text-decoration:none;font-weight:800;font-size:11px}.msg-meta{display:flex;justify-content:flex-start;align-items:center;gap:6px;margin-top:4px;font-size:9px;opacity:.56}.message-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;opacity:.86}.message-actions button{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:31px;height:28px;padding:0 7px;border:1px solid rgba(102,77,30,.13);border-radius:8px;background:rgba(255,255,255,.55);color:inherit;cursor:pointer;font:inherit;font-size:10px}.message-actions button:hover{background:#fff;transform:translateY(-1px)}.message-actions svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.quote{padding:6px 9px;margin-bottom:7px;border-right:3px solid #c49327;background:rgba(0,0,0,.045);border-radius:7px;font-size:10px}.deleted-message{opacity:.62;font-style:italic}.order-status-box{margin-top:9px;padding:9px;border-radius:12px;background:rgba(255,255,255,.5);border:1px solid rgba(98,72,20,.12)}.order-status-box strong{display:block;font-size:10px;margin-bottom:6px}.owner-status-actions{display:flex;gap:6px}.owner-status-actions button{flex:1;border:0;border-radius:10px;padding:8px 7px;color:#fff;font-weight:900;cursor:pointer;font-family:inherit;font-size:10px}.owner-status-actions .ok{background:#2e9b4d}.owner-status-actions .bad{background:#c94343}.status-result{font-size:10px;font-weight:900;margin-top:6px}.status-success{color:#1d873e}.status-failed{color:#b52f2f}
.reply-preview{display:none;padding:9px 16px;background:#fff6d9;border-top:1px solid #ead9b5;align-items:center;justify-content:space-between;gap:10px}.reply-preview.open{display:flex}.reply-preview button{border:0;background:transparent;font-size:20px;cursor:pointer}.support-compose{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 15px;background:#fff;border-top:1px solid var(--line)}.compose-wrap{display:grid;gap:7px}.support-compose textarea{min-height:56px;max-height:150px;resize:none;border:1px solid #dccfb8;background:#fffdf8;border-radius:15px;padding:11px 13px;outline:none;font:inherit;line-height:1.8}.support-compose textarea:focus{border-color:#d9aa2e;box-shadow:0 0 0 4px rgba(217,170,46,.11)}.compose-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.compose-tools label,.compose-tools button{display:inline-flex;align-items:center;gap:6px;border:1px solid #e1d5c1;background:#fffaf0;color:#624a19;border-radius:10px;padding:7px 10px;cursor:pointer;font:inherit;font-size:10px;font-weight:800}.compose-tools svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}.send-btn{align-self:stretch;min-width:105px;border:0;border-radius:15px;background:linear-gradient(145deg,#f8d56a,#d79c1c);color:#2c210d;font-weight:900;box-shadow:0 10px 22px rgba(203,150,26,.2);cursor:pointer;font-family:inherit}.lightbox{position:fixed;inset:0;z-index:200000;display:none;place-items:center;padding:25px;background:rgba(5,5,4,.84);backdrop-filter:blur(7px)}.lightbox.open{display:grid}.lightbox img{max-width:min(92vw,900px);max-height:88vh;border:2px solid #e7b52f;border-radius:14px;box-shadow:0 25px 80px rgba(0,0,0,.45)}.lightbox button{position:absolute;top:18px;left:18px;width:44px;height:44px;border:1px solid rgba(255,220,120,.45);border-radius:50%;background:#17130d;color:#ffe9a3;font-size:24px;cursor:pointer}.select-mode .support-bubble{cursor:pointer}.selection-count{position:fixed;right:18px;bottom:18px;z-index:10000;background:#1b160e;color:#ffe7a0;border:1px solid #8b6417;border-radius:999px;padding:9px 14px;display:none;font-weight:900;font-size:11px}.selection-count.open{display:block}
@media(max-width:720px){.support-page{padding:0}.support-card{height:100dvh;min-height:0;border-radius:0;border:0}.support-hero{min-height:96px;padding:12px 13px}.support-avatar-wrap{width:65px;height:65px;flex-basis:65px}.support-avatar{width:54px;height:54px}.support-title h1{font-size:17px}.support-title p{font-size:10px;margin-top:4px}.support-messages{padding:14px 10px}.support-bubble{max-width:88%;font-size:13px}.support-media{max-width:122px;max-height:145px}.support-compose{grid-template-columns:1fr;padding:9px}.send-btn{min-height:46px}.compose-tools label,.compose-tools button{padding:7px 8px}.message-actions button{min-width:29px;height:29px}.owner-status-actions button{padding:8px 4px}}
html[data-theme="dark"] .support-card{background:#191713}.support-compose,.support-hero{color:inherit}html[data-theme="dark"] .support-bubble{background:#24211c!important;color:#f6f0e5!important;border-color:#4a4033}html[data-theme="dark"] .support-row.owner .support-bubble{background:linear-gradient(145deg,#d9ae3f,#b8871d)!important;color:#17120a!important;border-color:#e7c35f}html[data-theme="dark"] .message-actions button{background:rgba(255,255,255,.78);color:inherit}html[data-theme="dark"] .support-compose{background:#15130f;border-color:#3e3529}html[data-theme="dark"] .support-compose textarea{background:#201c17;color:#f4efe4;border-color:#4a4033}html[data-theme="dark"] .compose-tools label,html[data-theme="dark"] .compose-tools button{background:#242019;color:#f4efe4;border-color:#4a4033}html[data-theme="dark"] .support-pinned-bar{background:#2a2416;color:#f3d57a;border-color:#4d4027}
.support-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.support-media-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;cursor:zoom-in;border:1px solid #e5b62e}.media-preview-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:250px}.media-preview-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;border:1px solid #e5b62e}.unpin-top{margin-right:auto;border:0;border-radius:8px;padding:5px 8px;background:#e5b73b;color:#2c210b;font:900 9px Tahoma;cursor:pointer}</style>
</head>
<body>
<main class="support-page"><section class="support-card">
<header class="support-hero {% if support_branding.background_image %}has-custom{% endif %}">
  <div class="support-avatar-wrap"><img class="support-avatar" src="{{ url_for('uploads',filename='support_branding/' + support_branding.profile_image) if support_branding.profile_image else url_for('images',filename='logo/logo.png') }}" alt="پروفایل پشتیبانی"></div>
  <div class="support-title"><h1>{{ support_branding.display_name }} <span class="verified-gold" title="تأیید شده"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span></h1><p><span class="support-online"><i></i>{{ support_branding.status }}</span> · {{ support_branding.profile_text or support_text or 'پاسخ‌گویی و هماهنگی سفارش‌های شهدآور' }}</p></div>
</header>
<div class="support-pinned-bar" id="pinnedBar" role="button" tabindex="0"></div><div class="support-messages" id="box" aria-live="polite"></div>
<div class="reply-preview" id="replyPreview"><span id="replyText"></span><button type="button" id="cancelReply" aria-label="لغو پاسخ">×</button></div>
<form class="support-compose" id="form"><div class="compose-wrap"><textarea id="input" maxlength="4000" placeholder="پیامتان را بنویسید…"></textarea><div class="compose-tools"><label title="پیوست"><svg viewBox="0 0 24 24"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 1 1 5 5L10.5 18a2 2 0 1 1-3-3l7.5-7.5"/></svg><span>پیوست</span><input id="media" type="file" multiple hidden accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,.rar"></label><button type="button" id="voice"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg><span>ویس</span></button><span id="recordState"></span></div></div><button class="send-btn" type="submit">ارسال پیام</button></form>
</section></main>
<div class="lightbox" id="lightbox"><button id="lightboxClose" aria-label="بستن">×</button><img id="lightboxImg" alt="نمایش بزرگ تصویر"></div><div class="selection-count" id="selectionCount"></div>
<script>
const token=document.querySelector('meta[name="csrf-token"]').content,box=document.getElementById('box'),pinnedBar=document.getElementById('pinnedBar'),form=document.getElementById('form'),input=document.getElementById('input'),media=document.getElementById('media');let replyTo=null,rec=null,chunks=[],voiceBlob=null,selected=new Set();media?.addEventListener('change',()=>{let o=document.getElementById('mediaPreview');o?.remove();if(!media.files.length)return;const g=document.createElement('div');g.id='mediaPreview';g.className='media-preview-grid';[...media.files].slice(0,10).forEach(f=>{if(f.type.startsWith('image/')){const i=document.createElement('img');i.src=URL.createObjectURL(f);g.appendChild(i)}});media.parentElement?.parentElement?.appendChild(g)});
const icons={reply:'<path d="M20 11a8 8 0 0 1-8 8H6l-3 2v-5a8 8 0 1 1 17-5z"/><path d="m9 11 2 2 4-4"/>',copy:'<rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 16H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/>',edit:'<path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="m13 7 4 4"/>',delete:'<path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/>',pin:'<path d="m15 4 5 5-3 1-4 4 1 3-2 2-2-5-4-4 2-2 3 1 4-4z"/>',share:'<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="m12 16V3m0 0L8 7m4-4 4 4"/>',select:'<path d="M5 3H3v2M19 3h2v2M5 21H3v-2M19 21h2v-2"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',check:'<path d="m5 12 4 4L19 6"/>'};
function svg(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[n]||'')+'</svg>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeText(v){return String(v??'').replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$')}
function render(ms){const pinned=(ms||[]).filter(x=>x.is_pinned).slice(-1)[0];if(pinned){pinnedBar.classList.add('open');pinnedBar.innerHTML=svg('pin')+' <span>پیام سنجاق‌شده: '+esc((pinned.message||'تصویر پیوست').slice(0,110))+'</span>'+(document.body.classList.contains('owner-chat')?'<button type="button" class="unpin-top" onclick="event.stopPropagation();pinMsg('+pinned.id+',false)">برداشتن سنجاق</button>':'');pinnedBar.onclick=()=>{const el=box.querySelector('[data-id=\"'+pinned.id+'\"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}}else{pinnedBar.classList.remove('open');pinnedBar.textContent=''}const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<90;box.innerHTML=(ms||[]).map(m=>{let att='';if(m.attachment_path){const u='/uploads/'+m.attachment_path;if(m.attachment_type==='image'){const ps=(m.attachment_paths&&m.attachment_paths.length?m.attachment_paths:[m.attachment_path]).slice(0,10);att='<div class="support-media-grid">'+ps.map(p=>'<img src="/uploads/'+esc(p)+'" alt="تصویر پیام" data-full="/uploads/'+esc(p)+'">').join('')+'</div>';}else if(m.attachment_type==='video')att='<video class="support-media" controls src="'+esc(u)+'"></video>';else if(m.attachment_type==='voice')att='<audio controls style="max-width:100%;margin-top:8px" src="'+esc(u)+'"></audio>';else att='<a class="support-file" href="'+esc(u)+'" target="_blank" rel="noopener">مشاهده فایل پیوست</a>';}const del=!!m.deleted_at,own=m.sender_type==='user',status=m.order_payment_status||'';let order='';if(m.order_id){const ok=status==='paid',bad=status==='failed';order='<div class="order-status-box"><strong>وضعیت خرید · '+esc(m.order_number||'سفارش')+'</strong>'+(m.sender_type==='owner'?'<span class="status-result '+(ok?'status-success':bad?'status-failed':'')+'">'+(ok?'خرید با موفقیت انجام شد':bad?'خرید ناموفق بود':'در انتظار بررسی مالک')+'</span>':'<span class="status-result '+(ok?'status-success':bad?'status-failed':'')+'">'+(ok?'خرید با موفقیت انجام شد':bad?'خرید ناموفق بود':'در انتظار بررسی پشتیبانی')+'</span>')+'</div>';}let actions='';if(!del){actions='<div class="message-actions"><button type="button" title="پاسخ" onclick="reply('+m.id+',`'+safeText(m.message)+'`)">'+svg('reply')+'</button><button type="button" title="کپی" onclick="copyMsg(`'+safeText(m.message)+'`)">'+svg('copy')+'</button><button type="button" title="انتخاب" onclick="toggleSelect('+m.id+',this)">'+svg('select')+'</button><button type="button" title="اشتراک‌گذاری" onclick="shareMsg(`'+safeText(m.message)+'`)">'+svg('share')+'</button>'+(own?'<button type="button" title="ویرایش" onclick="editMsg('+m.id+',`'+safeText(m.message)+'`)">'+svg('edit')+'</button><button type="button" title="حذف" onclick="deleteMsg('+m.id+')">'+svg('delete')+'</button>':'')+'</div>';}return '<div class="support-row '+m.sender_type+'"><div class="support-bubble '+(m.is_pinned?'pinned ':'')+(del?'deleted-message':'')+'" data-id="'+m.id+'">'+(m.is_pinned?'<div class="pinned-mark">'+svg('pin')+' سنجاق‌شده</div>':'')+(m.reply_to_message?'<div class="quote">در پاسخ به: '+esc(m.reply_to_message)+'</div>':'')+esc(m.message)+att+'<div class="msg-meta">'+esc(m.created_at_display||m.created_at||'')+(m.edited_at?' · ویرایش شده':'')+'</div>'+order+actions+'</div></div>'}).join('');if(atBottom)box.scrollTop=box.scrollHeight;box.querySelectorAll('[data-full]').forEach(el=>el.addEventListener('click',()=>openLightbox(el.dataset.full)));}
function reply(id,t){replyTo=id;document.getElementById('replyText').textContent='در پاسخ به: '+t.slice(0,100);document.getElementById('replyPreview').classList.add('open');input.focus()}document.getElementById('cancelReply').onclick=()=>{replyTo=null;document.getElementById('replyPreview').classList.remove('open')};
async function copyMsg(t){try{await navigator.clipboard.writeText(t);toast('متن پیام کپی شد')}catch(e){toast('کپی پیام انجام نشد')}}async function shareMsg(t){try{if(navigator.share)await navigator.share({text:t});else await navigator.clipboard.writeText(t),toast('متن پیام کپی شد')}catch(e){}}function toast(t){const old=document.getElementById('shdToast');if(old)old.remove();const x=document.createElement('div');x.id='shdToast';x.textContent=t;x.style='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300000;background:#201a10;color:#ffe6a0;padding:10px 15px;border-radius:999px;font:800 11px Tahoma;box-shadow:0 10px 30px #0005';document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function toggleSelect(id,btn){if(selected.has(id)){selected.delete(id);btn.style.background=''}else{selected.add(id);btn.style.background='#f5cf63'}const box=document.getElementById('selectionCount');box.textContent=selected.size+' پیام انتخاب شده';box.classList.toggle('open',selected.size>0)}
async function load(){try{const r=await fetch('/api/support/messages',{cache:'no-store'});if(r.status===401){location.href='/account';return}const d=await r.json();if(d.success)render(d.messages)}catch(e){}}
async function editMsg(id,old){const v=prompt('متن جدید پیام:',old);if(v===null||!v.trim())return;await fetch('/api/support/messages/'+id,{method:'PUT',headers:{'Content-Type':'application/json','X-CSRFToken':token},body:JSON.stringify({message:v})});load()}async function deleteMsg(id){if(!confirm('پیام حذف شود؟'))return;await fetch('/api/support/messages/'+id,{method:'DELETE',headers:{'X-CSRFToken':token}});load()}
form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text&&!media.files[0]&&!voiceBlob)return;const fd=new FormData();fd.append('message',text);if(replyTo)fd.append('reply_to_message_id',replyTo);if(media.files.length){[...media.files].slice(0,10).forEach(f=>fd.append('media',f));}else if(voiceBlob)fd.append('media',voiceBlob,'voice.webm');const r=await fetch('/api/support/messages',{method:'POST',headers:{'X-CSRFToken':token},body:fd});const d=await r.json();if(d.success){input.value='';media.value='';document.getElementById('mediaPreview')?.remove();voiceBlob=null;replyTo=null;document.getElementById('replyPreview').classList.remove('open');document.getElementById('recordState').textContent='';render(d.messages)}};input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){if(window.matchMedia("(max-width:650px)").matches)return;e.preventDefault();form.requestSubmit()}});
document.getElementById('voice').onclick=async()=>{if(rec&&rec.state==='recording'){rec.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{voiceBlob=new Blob(chunks,{type:'audio/webm'});document.getElementById('recordState').textContent='ویس آماده ارسال است';stream.getTracks().forEach(t=>t.stop())};rec.start();document.getElementById('recordState').textContent='در حال ضبط…'}catch(e){toast('دسترسی میکروفون ممکن نیست')}};
function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('open')}function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.getElementById('lightboxImg').src=''}document.getElementById('lightboxClose').onclick=closeLightbox;document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')closeLightbox()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});
load();setInterval(load,4500);
</script></body></html>
