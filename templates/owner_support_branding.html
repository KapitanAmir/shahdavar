<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="csrf-token" content="{{ csrf_token }}"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروفایل پشتیبانی | شهدآور</title><link rel="stylesheet" href="{{ url_for('css_files',filename='owner.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='owner_panel.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='theme.css') }}"><script src="{{ url_for('js_files',filename='theme.js') }}"></script><style>
.page{width:min(1050px,calc(100% - 24px));margin:30px auto}.card{background:#fff;border:1px solid #e8dcc7;border-radius:26px;padding:22px;margin-bottom:18px;box-shadow:0 15px 45px rgba(60,42,10,.07)}.hero{min-height:250px;border-radius:22px;padding:25px;display:flex;align-items:center;justify-content:center;text-align:center;background:#0a0c0d url('{{ url_for('images',filename='support/support-cover.svg') }}') center/cover;overflow:hidden;color:#fff}.avatar{width:120px;height:120px;object-fit:cover;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);border:4px solid #e4b638;box-shadow:0 12px 30px #0008}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{padding:15px;border:1px solid #eadfce;border-radius:16px;background:#fffaf0}.field label{display:block;font-weight:900;margin-bottom:9px}.field input{width:100%}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.btn{border:0;border-radius:13px;padding:12px 17px;background:#efbd3d;color:#2a210f;font:900 12px Tahoma;cursor:pointer;text-decoration:none}.muted{color:#7f715f;font-size:11px;line-height:1.9}@media(max-width:700px){.fields{grid-template-columns:1fr}.actions{flex-direction:column}.btn{text-align:center}.page{width:calc(100% - 16px)}}
html[data-theme="dark"] .card,html[data-theme="dark"] .field{background:#191713!important;color:#f4efe4!important;border-color:#433a2c!important}html[data-theme="dark"] .field{background:#211d17!important}.field input{padding:10px;border:1px solid #d9cdb8;border-radius:10px;background:#fff}.preview-bg{margin-top:12px;width:100%;height:130px;border-radius:14px;background:center/cover no-repeat url('{{ url_for('images',filename='support/support-cover.svg') }}');border:1px solid #dfcfad}
</style></head><body><main class="page"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px"><div><h1 style="margin:0">ظاهر پشتیبانی شهدآور</h1><p class="muted">پروفایل و پس‌زمینه‌ای که مشتری داخل گفت‌وگوی پشتیبانی می‌بیند را از اینجا تغییر دهید.</p></div><a class="btn" href="{{ url_for('owner_messages') }}">بازگشت به پیام‌ها</a></div><section class="card"><div class="hero"><div><img class="avatar" src="{{ url_for('uploads',filename='support_branding/' + support_branding.profile_image) }}" alt="پروفایل پشتیبانی"><h2 style="margin:14px 0 5px">{{ support_branding.display_name }} <span style="display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e6b536;color:#2a210d;font-size:12px">✓</span></h2><div style="color:#9ceca7;font-weight:900;font-size:11px">● آنلاین</div></div></div></section><form class="card" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="fields"><div class="field"><label>نام پشتیبانی</label><input type="text" name="support_display_name" maxlength="80" value="{{ support_branding.display_name }}" placeholder="پشتیبانی شهدآور"></div><div class="field"><label>متن پروفایل پشتیبانی</label><input type="text" name="support_profile_text" maxlength="220" value="{{ support_branding.profile_text }}" placeholder="پاسخ‌گویی و هماهنگی سفارش‌های شهدآور"></div><div class="field"><label>تصویر پروفایل پشتیبانی</label><input type="file" name="support_profile_image" accept=".jpg,.jpeg,.png,.webp"><p class="muted">پیشنهاد: تصویر مربعی یا پرتره با کیفیت. قاب شش‌ضلعی به‌صورت خودکار روی آن اعمال می‌شود.</p></div><div class="field"><label>متن پیام شناور بالای سایت</label><input type="text" name="support_popup_text" maxlength="180" value="{{ support_branding.popup_text }}" placeholder="پشتیبانی شهدآور: سوالی دارید در خدمتم!"></div><div class="field"><label>رنگ قاب پیام شناور</label><input type="color" name="support_popup_color" value="{{ support_branding.popup_color }}"><label style="display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11px"><input type="checkbox" name="support_popup_enabled" value="1" {% if support_branding.popup_enabled %}checked{% endif %} style="width:auto"> نمایش پیام شناور هنگام ورود</label><button class="btn" type="button" onclick="document.querySelector('[name=support_popup_color]').value='#d9a62e'">بازگشت رنگ اولیه</button></div><div class="field"><label>پس‌زمینه گفت‌وگو</label><input type="file" name="support_background_image" accept=".jpg,.jpeg,.png,.webp"><div class="preview-bg" {% if support_branding.background_image %}style="background-image:url('{{ url_for('uploads',filename='support_branding/' + support_branding.background_image) }}')"{% endif %}></div><label style="display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11px"><input type="checkbox" name="remove_background" value="1" style="width:auto"> بازگشت به کاور شش‌ضلعی حرفه‌ای پیش‌فرض</label></div></div><div class="actions"><a class="btn" href="{{ url_for('support_page') }}">مشاهده صفحه پشتیبانی</a><button class="btn" type="submit">ذخیره تغییرات</button></div></form></main></body></html>
