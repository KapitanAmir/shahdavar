<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="csrf-token" content="{{ csrf_token }}"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت بنرها | شهدآور</title><link rel="stylesheet" href="{{ url_for('css_files',filename='owner_panel.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='owner.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='theme.css') }}"><script src="{{ url_for('js_files',filename='theme.js') }}"></script><style>.manager-page{padding-bottom:60px}.banner-limit{padding:12px 15px;border-radius:12px;background:#f7f0df;margin-bottom:18px}.banner-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.banner-card{border:1px solid #eadfce;border-radius:18px;overflow:hidden;background:#fff}.banner-image img{width:100%;height:180px;object-fit:cover;display:block}.banner-info{padding:15px}.banner-info form{margin-top:8px}.banner-info input{width:100%;box-sizing:border-box}.banner-actions{display:flex;gap:7px;flex-wrap:wrap}.banner-actions form{margin:0}.banner-actions button{border:0;border-radius:9px;padding:8px 10px;cursor:pointer;font-family:inherit}.banner-save{background:#f2bf3f;color:#2a210c}.banner-toggle{background:#e7f0df;color:#38662c}.banner-delete{background:#f5e5e2;color:#8e3d35}.banner-move{background:#eee9df;color:#4b4237}@media(max-width:750px){.banner-grid{grid-template-columns:1fr}}
</style></head><body><div class="manager-page"><header class="manager-header"><a href="{{ url_for('owner_dashboard') }}" class="manager-back">← پنل مالکیت</a><div><h1>📢 مدیریت بنرهای محصولات</h1><p>حداکثر ۵ بنر فعال/ثبت‌شده برای بخش محصولات</p></div></header><main class="manager-container"><div class="banner-limit">{{ banners|length }} / 5 بنر ثبت شده</div>{% if banners|length < 5 %}<section class="manager-card"><div class="manager-card-title"><h2>➕ افزودن بنر</h2></div><form method="POST" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>تصویر بنر<input type="file" name="banner" accept=".jpg,.jpeg,.png,.webp" required></label><label>عنوان<input type="text" name="title" maxlength="200" placeholder="عنوان تبلیغ"></label><label>لینک<input type="url" name="link" placeholder="https://..."></label><button class="manager-primary-button" type="submit">افزودن بنر</button></form></section>{% endif %}<section class="manager-card"><div class="manager-card-title"><h2>بنرهای فعلی</h2></div>{% if banners %}<div class="banner-grid">{% for b in banners %}<article class="banner-card"><div class="banner-image"><img src="{{ url_for('uploads',filename='banners/' + b.filename) }}" alt="{{ b.title or 'بنر شهدآور' }}"></div><div class="banner-info"><form method="post" enctype="multipart/form-data" action="{{ url_for('update_banner_route',banner_id=b.id) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>عنوان<input type="text" name="title" maxlength="200" value="{{ b.title or '' }}"></label><label>لینک<input type="url" name="link" value="{{ b.link or '' }}"></label><label>جایگزینی تصویر<input type="file" name="banner" accept=".jpg,.jpeg,.png,.webp"></label><button class="banner-save" type="submit">💾 ذخیره</button></form><div class="banner-actions"><form method="post" action="{{ url_for('move_banner_route',banner_id=b.id,direction='up') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="banner-move">⬆️ بالا</button></form><form method="post" action="{{ url_for('move_banner_route',banner_id=b.id,direction='down') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="banner-move">⬇️ پایین</button></form><form method="post" action="{{ url_for('toggle_banner_route',banner_id=b.id) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="banner-toggle">{% if b.is_active %}👁 فعال{% else %}🚫 غیرفعال{% endif %}</button></form><form method="post" action="{{ url_for('delete_banner_route',banner_id=b.id) }}" onsubmit="return confirm('این بنر حذف شود؟')">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="banner-delete">🗑 حذف</button></form></div></div></article>{% endfor %}</div>{% else %}<div class="empty-manager">هنوز بنری ثبت نشده است.</div>{% endif %}</section></main></div></body></html>
