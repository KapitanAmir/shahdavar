<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ساخت پروفایل | شهدآور</title><link rel="stylesheet" href="{{ url_for('css_files',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='theme.css') }}"></head><body><main class="profile-wizard"><div class="wizard-head"><span>شهدآور</span><h1>ساخت پروفایل عمومی</h1><p>مثل یک صفحه معرفی شخصی؛ نام کاربری، معرفی، تصویر و لینک‌های شما.</p></div><form method="post" enctype="multipart/form-data" class="wizard-card"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>نام و نام نمایشی<input name="display_name" value="{{ profile.display_name if profile else (user.first_name ~ ' ' ~ user.last_name) }}" required></label><label>نام کاربری اختصاصی<input name="username" value="{{ profile.username if profile else '' }}" placeholder="amir_beekeeper" required><small>نام کاربری لینک پروفایل شماست و بهتر است کوتاه و انگلیسی باشد.</small></label><label>تصویر پروفایل<input type="file" name="avatar" accept=".jpg,.jpeg,.png,.webp"></label><label>معرفی کوتاه<textarea name="bio_html" id="bio">{{ profile.bio_html|safe if profile else '<p>سلام! اینجا صفحه معرفی من در شهدآور است.</p>' }}</textarea></label><h2>لینک‌ها</h2><div id="links">{% if profile and profile.links %}{% for x in profile.links %}<div class="link-row"><input name="link_title" value="{{ x.title }}"><input name="link_url" value="{{ x.url }}"><button type="button" onclick="this.parentElement.remove()">×</button></div>{% endfor %}{% endif %}<div class="link-row"><input name="link_title" placeholder="مثلاً اینستاگرام"><input name="link_url" placeholder="https://..."><button type="button" onclick="this.parentElement.remove()">×</button></div></div><button type="button" class="add" onclick="document.getElementById('links').insertAdjacentHTML('beforeend','<div class=\'link-row\'><input name=\'link_title\' placeholder=\'عنوان لینک\'><input name=\'link_url\' placeholder=\'https://...\'><button type=\'button\' onclick=\'this.parentElement.remove()\'>×</button></div>')">+ افزودن لینک</button><button class="save" type="submit">ساخت / ذخیره پروفایل</button></form></main><style>.profile-wizard{max-width:760px;margin:40px auto;padding:0 18px}.wizard-head{text-align:center;margin-bottom:22px}.wizard-head>span{color:#b47908;font-weight:900}.wizard-head h1{margin:8px 0}.wizard-card{background:#fff;border:1px solid #eadfce;border-radius:26px;padding:24px;box-shadow:0 18px 50px rgba(70,48,15,.08);display:grid;gap:14px}.wizard-card label{display:grid;gap:7px;font-weight:800}.wizard-card input,.wizard-card textarea{border:1px solid #ded2bf;border-radius:12px;padding:12px;font-family:inherit}.wizard-card textarea{min-height:150px}.wizard-card small{color:#8e7c66;font-weight:400}.link-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-bottom:8px}.link-row input{min-width:0}.link-row button{border:0;background:#fae8e8;color:#a33;border-radius:10px}.add,.save{border:0;border-radius:12px;padding:12px 16px;font-family:inherit;font-weight:900;cursor:pointer}.add{background:#f3eadb}.save{background:#eab52f;color:#2c210c;margin-top:6px}@media(max-width:600px){.link-row{grid-template-columns:1fr}.link-row button{padding:9px}}</style></body></html>
