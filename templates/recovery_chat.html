<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="csrf-token" content="{{ csrf_token }}"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فراموشی رمز | شهدآور</title><link rel="stylesheet" href="{{ url_for('css_files',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='theme.css') }}"><script src="{{ url_for('js_files',filename='theme.js') }}"></script><style>.recovery{max-width:900px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid #eadfcd;border-radius:24px;overflow:hidden}.head{padding:22px;border-bottom:1px solid #eee}.messages{height:500px;overflow:auto;padding:20px;background:#f8f5ef}.row{display:flex;margin:9px 0}.row.user{justify-content:flex-start}.row.owner{justify-content:flex-end}.bubble{max-width:75%;padding:12px 15px;border-radius:17px;white-space:pre-wrap;line-height:1.8}.user .bubble{background:#fff}.owner .bubble{background:#f0c75b}.compose{display:flex;gap:10px;padding:15px;border-top:1px solid #eee}.compose textarea{flex:1;min-height:65px;border:1px solid #ddd;border-radius:13px;padding:10px;font-family:inherit}.compose button{border:0;border-radius:13px;padding:0 22px;background:#f2b72d;font-weight:900}.phone{padding:12px 15px;background:#fff8df;border-bottom:1px solid #eadfbd}.phone input{padding:9px;border:1px solid #ddcfae;border-radius:10px;font-family:inherit}@media(max-width:650px){.bubble{max-width:88%}}</style></head><body><main class="recovery"><section class="card"><header class="head"><h1>🔑 بازیابی رمز عبور</h1><p>شماره موبایل خود را در پیام اعلام کنید؛ پشتیبانی از همین‌جا راهنمایی‌تان می‌کند.</p></header><div class="phone">شماره موبایل: <input id="phone" inputmode="numeric" maxlength="11" placeholder="0912..." value=""></div><div id="messages" class="messages"></div><form id="form" class="compose"><textarea id="input" maxlength="4000" placeholder="مثلاً رمز عبورم را فراموش کرده‌ام..." required></textarea><button>ارسال</button></form></section></main><script>const box=document.getElementById('messages'),form=document.getElementById('form'),input=document.getElementById('input'),phone=document.getElementById('phone'),token=document.querySelector('meta[name="csrf-token"]').content;function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}function render(ms){box.innerHTML=(ms||[]).map(m=>'<div class="row '+m.sender_type+'"><div class="bubble">'+esc(m.message)+'<small style="display:block;opacity:.5">'+esc(m.created_at||'')+'</small></div></div>').join('');box.scrollTop=box.scrollHeight;}async function load(){const r=await fetch('/api/recovery/messages',{cache:'no-store'});const d=await r.json();if(d.success)render(d.messages)}form.addEventListener('submit',async e=>{e.preventDefault();const m=input.value.trim();if(!m)return;const r=await fetch('/api/recovery/messages',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':token},body:JSON.stringify({message:m,phone:phone.value})});const d=await r.json();if(d.success){input.value='';render(d.messages)}});load();setInterval(load,5000);</script></body></html>
