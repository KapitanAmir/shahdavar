<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="csrf-token" content="{{ csrf_token }}"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کاربران ثبت‌نامی | شهدآور</title><link rel="stylesheet" href="{{ url_for('css_files',filename='owner_panel.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='owner.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='theme.css') }}"><script src="{{ url_for('js_files',filename='theme.js') }}"></script><style>.users-page{max-width:1200px;margin:35px auto;padding:0 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.search{display:flex;gap:8px;margin:20px 0}.search input{flex:1;padding:13px;border:1px solid #ddd1bd;border-radius:13px;font-family:inherit}.search button{border:0;border-radius:13px;padding:0 20px;background:#efb934;font-weight:900}.table{background:#fff;border:1px solid #e7dece;border-radius:20px;overflow:auto}.row{display:grid;grid-template-columns:70px 1.2fr 1fr 1fr 1fr 100px;min-width:850px;align-items:center;border-bottom:1px solid #eee7dc;padding:12px 15px;gap:12px}.row.header{font-weight:900;background:#fbf5e9}.avatar{width:45px;height:45px;border-radius:50%;object-fit:cover}.view{display:inline-block;background:#f1c24b;color:#2b210d;text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:900}.count{padding:12px 15px;background:#fff8df;border-radius:13px;display:inline-block}.empty{text-align:center;padding:40px}.back{color:#8d5d0a;text-decoration:none;font-weight:900}</style></head><body><main class="users-page owner-users-page"><div class="head"><div><h1>👥 کاربران ثبت‌نامی</h1><p>تعداد کل: <span class="count">{{ user_count }}</span></p></div><a class="back" href="{{ url_for('owner_dashboard') }}">← پنل مالک</a></div><form class="search" method="get"><input name="q" value="{{ q }}" placeholder="جستجو با شماره موبایل، نام کاربری، ایمیل یا نام"><button>🔎 جستجو</button></form><div class="table"><div class="row header"><div>تصویر</div><div>نام</div><div>نام کاربری</div><div>شماره</div><div>ایمیل</div><div>عملیات</div></div>{% for u in users %}<div class="row"><div><img class="avatar" src="{{ url_for('uploaded_file',filename='profiles/' + u.avatar) }}"></div><div>{{ u.first_name }} {{ u.last_name }}</div><div>@{{ u.username }}</div><div>{{ u.phone }}</div><div>{{ u.email or '—' }}</div><div><a class="view" href="{{ url_for('owner_user_profile',user_id=u.id) }}">مشاهده</a></div></div>{% else %}<div class="empty">کاربری با این مشخصات پیدا نشد.</div>{% endfor %}</div></main></body></html>
