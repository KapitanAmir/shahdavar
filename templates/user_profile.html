<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="csrf-token" content="{{ csrf_token }}"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروفایل کاربر | شهدآور</title><link rel="stylesheet" href="{{ url_for('css_files',filename='owner_panel.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='owner.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='theme.css') }}"><script src="{{ url_for('js_files',filename='theme.js') }}"></script><style>.user-admin{max-width:900px;margin:35px auto;padding:0 18px}.card{background:#fff;border:1px solid #e8dece;border-radius:22px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.07)}.user-head{display:flex;gap:16px;align-items:center;margin-bottom:25px}.user-head img{width:82px;height:82px;border-radius:50%;object-fit:cover}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field input,.field select{padding:12px;border:1px solid #ddd2c0;border-radius:12px;font-family:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions button,.actions a{border:0;border-radius:12px;padding:12px 18px;text-decoration:none;font-family:inherit;font-weight:900;cursor:pointer;background:#efb934;color:#2a210f}.actions a{background:#f4eee3}@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><main class="user-admin"><div class="card"><div class="user-head"><img src="{{ url_for('uploaded_file',filename='profiles/' + user.avatar) }}" alt=""><div><h1>{{ user.first_name }} {{ user.last_name }}</h1><p>@{{ user.username }} · شناسه {{ user.id }}</p></div></div><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="grid"><div class="field"><label>نام</label><input name="first_name" value="{{ user.first_name }}" required></div><div class="field"><label>نام خانوادگی</label><input name="last_name" value="{{ user.last_name }}" required></div><div class="field"><label>نام کاربری</label><input name="username" value="{{ user.username or '' }}"></div><div class="field"><label>شماره موبایل</label><input name="phone" value="{{ user.phone }}" required></div><div class="field"><label>ایمیل</label><input type="email" name="email" value="{{ user.email or '' }}"></div><div class="field"><label>جنسیت</label><input name="gender" value="{{ user.gender or '' }}"></div><div class="field"><label>استان</label><input name="province" value="{{ user.province or '' }}"></div><div class="field"><label>شهر</label><input name="city" value="{{ user.city or '' }}"></div><div class="field full"><label>رمز عبور جدید (اختیاری)</label><input type="password" name="new_password" placeholder="اگر خالی باشد تغییر نمی‌کند"></div></div><div class="actions"><button type="submit">💾 ذخیره تغییرات</button><a href="{{ url_for('owner_users') }}">← کاربران</a><a href="{{ url_for('owner_dashboard') }}">پنل مالک</a></div></form></div></main></body></html>
