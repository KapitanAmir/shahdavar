<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ article.seo_title or article.title }} | {{ site.site_name }}</title><meta name="description" content="{{ article.seo_description or article.excerpt }}"><link rel="canonical" href="{{ request.host_url.rstrip('/') }}/knowledge/{{ article.slug }}">{% if article.cover_image %}<meta property="og:image" content="{{ request.host_url.rstrip('/') }}/uploads/knowledge/{{ article.cover_image }}">{% endif %}<script type="application/ld+json">{{ {'@context':'https://schema.org','@type':'Article','headline':article.title,'description':article.excerpt,'url':request.host_url.rstrip('/') ~ '/knowledge/' ~ article.slug,'image':([request.host_url.rstrip('/') ~ '/uploads/knowledge/' ~ article.cover_image] if article.cover_image else [])}|tojson }}</script><link rel="stylesheet" href="{{ url_for('css_files',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('css_files',filename='theme.css') }}"><script src="{{ url_for('js_files',filename='theme.js') }}"></script><style>.knowledge-detail{max-width:900px;margin:40px auto;padding:0 18px}.article-shell{background:#fff;border:1px solid #eadfce;border-radius:26px;overflow:hidden}.article-head{padding:30px;background:linear-gradient(135deg,#fff8df,#fff)}.article-head img{width:100%;max-height:430px;object-fit:cover;border-radius:18px;margin-top:18px}.article-body{padding:32px;font-size:17px;line-height:2.25}.article-body img{max-width:100%;height:auto;border-radius:15px}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff0c5;color:#91620a;font-size:11px;font-weight:900}</style></head><body><main class="knowledge-detail"><article class="article-shell"><header class="article-head">{% if article.category %}<span class="tag">{{ article.category }}</span>{% endif %}<h1>{{ article.title }}</h1><p>{{ article.excerpt }}</p>{% if article.cover_image %}<img src="{{ url_for('uploads',filename='knowledge/'+article.cover_image) }}" alt="{{ article.title }}">{% endif %}</header><section class="article-body">{{ article.content_html|safe }}</section></article></main></body></html>
